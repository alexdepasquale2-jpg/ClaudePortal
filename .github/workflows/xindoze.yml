name: xindoze

# Cheap checks run on every push. Heavy jobs (Windows, Android, bundles,
# real-model e2e, Native image) run on manual dispatch to save minutes.
on:
  push:
    paths: ["xindoze/**", ".github/workflows/xindoze.yml"]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Heavy jobs: all, or a comma list of windows,android,linux-bundle,e2e,native"
        default: all

concurrency:
  group: xindoze-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: xindoze

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xindoze
      # The Tauri shell needs the Canvas (shell/ui) and WebKit. It stays out
      # of this job until Phase 1. xindoze-shell is the package name.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Seed Bank evals against the mock
        run: cargo run -p xinod --bin xz -- eval

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: xindoze/Cargo.toml
          command: check licenses bans sources
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm licenses
        working-directory: xindoze/shell/ui
        if: hashFiles('xindoze/shell/ui/package.json') != ''
        run: |
          npm ci
          npx --yes license-checker-rseidelsohn --production --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;MPL-2.0;OFL-1.1;BlueOak-1.0.0;Unlicense"

  windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'windows'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xindoze
      - name: Canvas UI
        working-directory: xindoze/shell/ui
        run: npm ci && npm run build
      - run: cargo test --workspace
      - name: NSIS installer
        working-directory: xindoze/shell
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: xindoze-windows-installer
          path: xindoze/target/release/bundle/nsis/*.exe

  linux-bundle:
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'linux-bundle'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Webview libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xindoze
      - name: Canvas UI
        working-directory: xindoze/shell/ui
        run: npm ci && npm run build
      - name: deb + AppImage
        working-directory: xindoze/shell
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: xindoze-linux-bundles
          path: |
            xindoze/target/release/bundle/deb/*.deb
            xindoze/target/release/bundle/appimage/*.AppImage

  android:
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'android'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xindoze
      - name: NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Canvas UI
        working-directory: xindoze/shell/ui
        run: npm ci && npm run build
      - name: APK
        run: bash shell/scripts/android-setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xindoze-android-apk
          path: xindoze/shell/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  e2e:
    # Real local model through Ollama: the acceptance tests of SPEC §12 with no scripted model.
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'e2e'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xindoze
      - name: Ollama
        working-directory: .
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull qwen3:4b
          ollama pull nomic-embed-text
      - name: Acceptance tests against a real model
        env:
          XZ_E2E_MODEL: qwen3:4b
          XZ_E2E_EMBED: nomic-embed-text
        run: cargo test -p xz-core --test e2e_real -- --ignored --nocapture --test-threads=1

  native:
    if: github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' || contains(inputs.jobs, 'native'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot the Native image in QEMU
        run: |
          bash native/build.sh x86_64
          bash native/test-boot.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: xindoze-native-x86_64
          path: xindoze/native/out/*.img*
