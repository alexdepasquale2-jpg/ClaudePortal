name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web bundle
        run: tar -czf skyneet-survivors-${{ github.ref_name }}.tar.gz -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: skyneet-survivors-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
