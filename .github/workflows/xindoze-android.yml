name: xindoze-android

on:
  push:
    branches: ["cursor/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: xindoze-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Companion smoke test
        working-directory: xindoze
        run: cargo test -p xz-android
      - name: Debug APKs
        run: bash xindoze/shell/scripts/android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xindoze-android-apk
          path: |
            xindoze/dist/android/*.apk
            xindoze/dist/android/*manifest.txt
            xindoze/dist/android/*files.txt
          if-no-files-found: error
