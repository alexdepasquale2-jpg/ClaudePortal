[package]
name = "xz-cortex"
description = "Cortex: local inference backends, model registry, scheduler, structured output (SPEC 3.6, 5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Embedded llama.cpp backend. Builds llama.cpp from source (needs cmake and a C++ toolchain).
llamacpp = ["dep:llama-cpp-2"]

[dependencies]
xz-types.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
toml = "1"
# Plain HTTP only: Ollama listens on localhost, and leaving TLS out keeps the tree pure Rust.
reqwest = { version = "0.13", default-features = false }
llama-cpp-2 = { version = "0.1", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile.workspace = true
