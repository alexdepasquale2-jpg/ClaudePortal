    <path id="biolume" d="M788 176C472 330 472 694 788 848" stroke="#2BF5C4" stroke-width="112"/>
  </g>
  <g stroke="#0B0D10" stroke-opacity="0.55" stroke-width="112" stroke-linecap="round" fill="none" stroke-dasharray="16 78" stroke-dashoffset="-62" mask="url(#bands)">
    <path d="M236 176C552 330 552 694 236 848"/>
