<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zero egress, active">
  <style>
    .halo, .ring { fill: none; stroke: #2BF5C4; }
    .core { fill: #2BF5C4; }
    .halo { stroke-width: 2; opacity: 0.45; transform-origin: 32px 32px; }
    @media (prefers-color-scheme: light) {
      .halo, .ring { stroke: #0B8F72; }
      .core { fill: #0B8F72; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .halo { animation: breathe 2.8s ease-in-out infinite; }
      .core { animation: breathe 2.8s ease-in-out infinite; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>
  <circle class="halo" cx="32" cy="32" r="22" />
  <circle class="ring" cx="32" cy="32" r="14" stroke-width="2.5"/>
  <circle class="core" cx="32" cy="32" r="4"/>
</svg>
