<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 16" role="img" aria-label="Model loading">
  <style>
    .track { fill: #EDE8DF; opacity: 0.12; }
    .sheen { fill: #2BF5C4; opacity: 0.85; }
    @media (prefers-color-scheme: light) {
      .track { fill: #0B0D10; opacity: 0.1; }
      .sheen { fill: #0B8F72; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .sheen { animation: sweep 1.4s ease-in-out infinite; }
    }
    @keyframes sweep {
      from { transform: translateX(0); }
      to { transform: translateX(168px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sheen { transform: translateX(70px); opacity: 0.55; }
    }
  </style>
  <rect class="track" x="0" y="4" width="280" height="8" rx="4"/>
  <rect class="sheen" x="8" y="4" width="96" height="8" rx="4"/>
</svg>
