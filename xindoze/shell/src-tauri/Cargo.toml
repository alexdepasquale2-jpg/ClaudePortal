[package]
name = "xindoze-shell"
description = "Canvas: the Xindoze shell (Tauri v2) for desktop and Android."
version.workspace = true
edition.workspace = true
# Tauri 2.x needs 1.90; the rest of the workspace targets 1.85.
rust-version = "1.90"
license.workspace = true
default-run = "xindoze-shell"

[lib]
# Distinct from the binary name so Windows does not collide on the .pdb/.dll outputs.
name = "xindoze_shell_lib"
# cdylib is the Android entry point (libxindoze_shell_lib.so); rlib serves main.rs and tests.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
xz-types.workspace = true
xz-android = { path = "../../crates/android" }
xz-cortex = { path = "../../crates/cortex" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tauri = { version = "~2.11.6", features = ["tray-icon"] }
tauri-plugin-android-bridge = { path = "../plugins/android-bridge" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
