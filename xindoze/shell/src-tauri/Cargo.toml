[package]
name = "xindoze-shell"
description = "Canvas: the Xindoze shell (Tauri v2) for desktop and Android."
version.workspace = true
edition.workspace = true
# Tauri 2.x needs 1.90; the rest of the workspace targets 1.85.
rust-version = "1.90"
license.workspace = true
default-run = "xindoze-shell"

[lib]
# Distinct from the binary name so Windows does not collide on the .pdb/.dll outputs.
name = "xindoze_shell_lib"
# cdylib is the Android entry point (libxindoze_shell_lib.so); rlib serves main.rs and tests.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
xz-types.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-android-bridge = { path = "../plugins/android-bridge" }
xinod = { path = "../../crates/xinod" }
xz-core = { path = "../../crates/core" }
xz-engram = { path = "../../crates/engram" }
xz-genome = { path = "../../crates/genome" }
xz-warden = { path = "../../crates/warden" }
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile.workspace = true
