# Xindoze model registry (SPEC §5). Data, not code: swap in better models freely.
#
# Each [[model]] entry:
#   name        unique id used in profiles and settings
#   roles       reflex | cortex | oracle | embed | vision
#   tiers       device tiers this entry is a pick for: spore (<= 4 GB) | sprout (<= 12 GB) | apex
#   license     SPDX id. Only OSI licenses (Apache-2.0, MIT, BSD-*) load by default;
#               anything else loads only with allow_restricted = true.
#   ollama      Ollama library tag (optional)
#   gguf        {url, sha256, size_mb} for embedded llama.cpp (optional).
#               sha256 stays empty until verified against the real file; never guess it.
#   min_ram_mb  RAM needed to run the model at its listed quantization
#   context     context length in tokens
#   quant       quantization of the listed weights (optional)
#   source      public model card (optional)
#
# File order is preference order: for a given role and tier, the first entry that
# fits the device wins. Larger models are listed first so they win when RAM allows.

allow_restricted = false

[[model]]
name = "qwen3-0.6b"
roles = ["reflex"]
tiers = ["spore"]
license = "Apache-2.0"
ollama = "qwen3:0.6b"
min_ram_mb = 1024
context = 32768
quant = "Q8_0"
source = "https://huggingface.co/Qwen/Qwen3-0.6B"
gguf = { url = "https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf", sha256 = "", size_mb = 640 }

