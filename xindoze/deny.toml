# License gate (SPEC §7): only permissive or weak-copyleft licenses in the runtime.
[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "openssl-sys", reason = "use rustls; openssl breaks Android/Windows cross builds" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
