<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prism</title>
<style>
  :root { --bg:#07060f; --fg:#f4f1ff; --dim:#9a93c0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden;
    overscroll-behavior:none; touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  header { width:100%; max-width:560px; display:flex; justify-content:space-between; align-items:flex-end; padding:14px 4px 8px; }
  .stat { display:flex; flex-direction:column; }
  .stat b { font-size:26px; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
  .stat span { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:2px; }
  .right { text-align:right; align-items:flex-end; }
  #bar { width:100%; max-width:560px; height:6px; border-radius:3px; background:#1a1730; overflow:hidden; margin-bottom:10px; }
  #fill { height:100%; width:0; background:linear-gradient(90deg,#ff3b6b,#ffb020,#3dff8a,#2fb8ff,#b04dff); transition:width .3s; }
  #wrap { flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { display:block; touch-action:none; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(7,6,15,.82); backdrop-filter:blur(6px); gap:14px; text-align:center; padding:24px; }
  #overlay.hide { display:none; }
  #overlay h1 { margin:0; font-size:56px; letter-spacing:10px; font-weight:800;
    background:linear-gradient(90deg,#ff3b6b,#ffb020,#3dff8a,#2fb8ff,#b04dff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #overlay p { margin:0; color:var(--dim); max-width:320px; line-height:1.5; }
  button { font:inherit; font-weight:700; font-size:18px; color:var(--bg); background:var(--fg); border:0;
    border-radius:999px; padding:14px 38px; min-height:48px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><span>Level</span><b id="level">1</b></div>
    <div class="stat" style="align-items:center"><span>Score</span><b id="score">0</b></div>
    <div class="stat right"><span>Moves</span><b id="moves">0</b></div>
  </header>
  <div id="bar"><div id="fill"></div></div>
  <div id="wrap"><canvas id="c"></canvas></div>
</div>
<div id="overlay">
  <h1>PRISM</h1>
  <p id="msg">Swipe a gem to swap. Match 3+ colors. Match 4 for a line blast, 5 for a prism that wipes a whole color.</p>
  <button id="go">Play</button>
</div>
<script>
"use strict";
// ---------- config ----------
const N = 8, COLORS = [
  [255,59,107],  // red
  [255,176,32],  // amber
  [61,255,138],  // green
  [47,184,255],  // blue
  [176,77,255],  // violet
  [255,240,90],  // yellow (unlocked at level 3)
];
const NONE = 0, LINE_H = 1, LINE_V = 2, PRISM = 3;
const SWAP_T = 0.14, FALL_G = 60, CLEAR_T = 0.18;

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);
let DPR = 1, size = 0, cell = 0;

// ---------- state ----------
let grid = [];            // grid[r][c] = gem | null
let level = 1, score = 0, goal = 0, moves = 0, nColors = 5;
let busy = false, combo = 0, shake = 0, flash = 0, time = 0, idle = 0, hint = null;
let sel = null;           // selected gem {r,c}
const parts = [], rings = [], popups = [];

function gem(color, special = NONE) {
  return { color, special, x: 0, y: 0, vy: 0, scale: 1, dying: 0, alpha: 1, spawn: 0 };
}
const rnd = n => (Math.random() * n) | 0;

// ---------- layout ----------
function resize() {
  const w = $('wrap');
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  size = Math.floor(Math.min(w.clientWidth, w.clientHeight, 560));
  cell = size / N;
  cvs.style.width = cvs.style.height = size + 'px';
  cvs.width = cvs.height = Math.floor(size * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sprites.clear();
}
window.addEventListener('resize', resize);

// ---------- pre-rendered gem sprites (fast drawing, rich look) ----------
const sprites = new Map();
function sprite(color, special) {
  const key = color + ':' + special;
  let s = sprites.get(key);
  if (s) return s;
  const px = Math.ceil(cell * DPR * 1.6);
  s = document.createElement('canvas'); s.width = s.height = px;
  const g = s.getContext('2d'), cx = px / 2, R = cell * DPR * 0.4;
  const [r, gg, b] = special === PRISM ? [255, 255, 255] : COLORS[color];
  // outer glow
  const glow = g.createRadialGradient(cx, cx, R * 0.4, cx, cx, px / 2);
  glow.addColorStop(0, `rgba(${r},${gg},${b},.55)`); glow.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = glow; g.fillRect(0, 0, px, px);
  // body: faceted gem shape per color for colorblind-friendliness
  g.save(); g.translate(cx, cx);
  shapePath(g, special === PRISM ? -1 : color, R);
  const body = g.createRadialGradient(-R * .35, -R * .4, R * .05, 0, 0, R * 1.1);
  if (special === PRISM) {
    body.addColorStop(0, '#fff'); body.addColorStop(.5, '#d9c9ff'); body.addColorStop(1, '#5a3aa8');
  } else {
    body.addColorStop(0, `rgb(${Math.min(255, r + 120)},${Math.min(255, gg + 120)},${Math.min(255, b + 120)})`);
    body.addColorStop(.55, `rgb(${r},${gg},${b})`);
    body.addColorStop(1, `rgb(${r * .35 | 0},${gg * .35 | 0},${b * .35 | 0})`);
  }
  g.fillStyle = body; g.fill();
  g.lineWidth = R * 0.07; g.strokeStyle = 'rgba(255,255,255,.55)'; g.stroke();
  // specular highlight
  g.beginPath(); g.ellipse(-R * .3, -R * .38, R * .32, R * .16, -0.6, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,.7)'; g.fill();
  // special markings
  if (special === LINE_H || special === LINE_V) {
    g.rotate(special === LINE_V ? Math.PI / 2 : 0);
    g.fillStyle = 'rgba(255,255,255,.95)';
    g.fillRect(-R * .9, -R * .09, R * 1.8, R * .18);
    for (const d of [-1, 1]) { g.beginPath(); g.moveTo(d * R * 1.05, 0); g.lineTo(d * R * .7, -R * .28); g.lineTo(d * R * .7, R * .28); g.fill(); }
  } else if (special === PRISM) {
    for (let i = 0; i < 5; i++) {
      const [pr, pg, pb] = COLORS[i]; g.fillStyle = `rgb(${pr},${pg},${pb})`;
      g.beginPath(); g.arc(Math.cos(i * 1.2566) * R * .45, Math.sin(i * 1.2566) * R * .45, R * .14, 0, Math.PI * 2); g.fill();
    }
  }
  g.restore();
  sprites.set(key, s);
  return s;
}
function shapePath(g, color, R) {
  g.beginPath();
  const poly = (n, rot, k = 1) => { for (let i = 0; i < n; i++) { const a = rot + i * Math.PI * 2 / n; g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * R * k, Math.sin(a) * R * k); } g.closePath(); };
  switch (color) {
    case 0: poly(4, Math.PI / 4, 1.12); break;           // square
    case 1: poly(6, 0); break;                           // hexagon
    case 2: poly(3, -Math.PI / 2, 1.15); break;          // triangle
    case 3: poly(4, 0, 1.1); break;                      // diamond
    case 4: { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, k = i % 2 ? .55 : 1.05; g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * R * k, Math.sin(a) * R * k); } g.closePath(); break; } // star
    case 5: poly(8, Math.PI / 8); break;                 // octagon
    default: g.arc(0, 0, R, 0, Math.PI * 2);             // prism: orb
  }
}

// ---------- board logic ----------
function newBoard() {
  do {
    grid = [];
    for (let r = 0; r < N; r++) {
      grid.push([]);
      for (let c = 0; c < N; c++) {
        let col;
        do { col = rnd(nColors); } while (
          (c >= 2 && grid[r][c - 1].color === col && grid[r][c - 2].color === col) ||
          (r >= 2 && grid[r - 1][c].color === col && grid[r - 2][c].color === col));
        const g = gem(col); g.x = c; g.y = r - N - 1 - rnd(3) * .3; grid[r].push(g);
      }
    }
  } while (!findMove());
}
const at = (r, c) => (r >= 0 && r < N && c >= 0 && c < N) ? grid[r][c] : null;
const same = (a, b) => a && b && a.special !== PRISM && b.special !== PRISM && a.color === b.color;

// Returns runs: [{cells:[[r,c]...], dir:'h'|'v'}]
function findRuns() {
  const runs = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N;) {
    let e = c + 1; while (e < N && same(grid[r][c], grid[r][e])) e++;
    if (e - c >= 3) runs.push({ dir: 'h', cells: Array.from({ length: e - c }, (_, i) => [r, c + i]) });
    c = e;
  }
  for (let c = 0; c < N; c++) for (let r = 0; r < N;) {
    let e = r + 1; while (e < N && same(grid[r][c], grid[e][c])) e++;
    if (e - r >= 3) runs.push({ dir: 'v', cells: Array.from({ length: e - r }, (_, i) => [r + i, c]) });
    r = e;
  }
  return runs;
}
function swapCells(a, b) { const t = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t; }
function findMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c].special === PRISM) return { a: { r, c }, b: { r, c: c ? c - 1 : c + 1 } };
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const a = { r, c }, b = { r: r + dr, c: c + dc };
      if (!at(b.r, b.c)) continue;
      swapCells(a, b); const ok = findRuns().length > 0; swapCells(a, b);
      if (ok) return { a, b };
    }
  }
  return null;
}

// ---------- tweens ----------
const tweens = [];
function tween(dur, fn) { return new Promise(res => tweens.push({ t: 0, dur, fn, res })); }
const ease = t => 1 - (1 - t) * (1 - t) * (1 - t);

async function animSwap(a, b) {
  const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
  await tween(SWAP_T, t => { const k = ease(t);
    ga.x = a.c + (b.c - a.c) * k; ga.y = a.r + (b.r - a.r) * k;
    gb.x = b.c + (a.c - b.c) * k; gb.y = b.r + (a.r - b.r) * k; });
  swapCells(a, b);
}

// ---------- the move ----------
async function trySwap(a, b) {
  if (busy || !at(b.r, b.c)) return;
  busy = true; sel = null; hint = null; idle = 0;
  const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
  await animSwap(a, b);
  let forced = null;
  if (ga.special === PRISM || gb.special === PRISM) {
    forced = prismBlast(ga, gb, b, a);
  } else if (ga.special && gb.special) {
    forced = new Set([key(b.r, b.c), key(a.r, a.c)]); // both detonate
  }
  if (!forced && !findRuns().length) {
    buzz(8); await animSwap(b, a); busy = false; return;
  }
  moves--; combo = 0;
  await resolve(forced, [b, a]);
  busy = false; updateHud(); checkEnd();
}
const key = (r, c) => r * N + c;

function prismBlast(ga, gb, pa, pb) {
  const set = new Set();
  const prism = ga.special === PRISM ? ga : gb, other = prism === ga ? gb : ga;
  const ppos = prism === ga ? pa : pb;
  set.add(key(ppos.r, ppos.c)); prism._fired = true;
  if (other.special === PRISM) { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) set.add(key(r, c)); }
  else {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = grid[r][c];
      if (g.color === other.color && g.special !== PRISM) {
        if (other.special === LINE_H || other.special === LINE_V) g.special = rnd(2) ? LINE_H : LINE_V;
        set.add(key(r, c)); beam(ppos, { r, c }, other.color);
      }
    }
  }
  flash = 1; shake = 14; buzz([20, 30, 40]);
  return set;
}

async function resolve(forced, swapped) {
  let first = true;
  while (true) {
    const runs = findRuns();
    const clear = new Set(forced || []); forced = null;
    const creates = [];
    // detect specials: 5-in-a-row -> prism; L/T -> line; 4 -> line
    const cellRuns = new Map();
    for (const run of runs) for (const [r, c] of run.cells) {
      clear.add(key(r, c));
      const k = key(r, c); cellRuns.set(k, (cellRuns.get(k) || []).concat([run]));
    }
    const used = new Set();
    for (const run of runs) {
      if (run.cells.some(([r, c]) => used.has(key(r, c)))) continue;
      let spot = run.cells[run.cells.length >> 1];
      if (first && swapped) for (const s of swapped) if (run.cells.some(([r, c]) => r === s.r && c === s.c)) spot = [s.r, s.c];
      const cross = run.cells.find(([r, c]) => cellRuns.get(key(r, c)).length > 1);
      let sp = NONE;
      if (run.cells.length >= 5) sp = PRISM;
      else if (cross) { sp = PRISM - (run.dir === 'h' ? 2 : 1); spot = cross; }
      else if (run.cells.length === 4) sp = run.dir === 'h' ? LINE_V : LINE_H;
      if (sp) { creates.push({ r: spot[0], c: spot[1], color: grid[spot[0]][spot[1]].color, sp }); run.cells.forEach(([r, c]) => used.add(key(r, c))); }
    }
    if (!clear.size) break;
    combo++;
    // chain detonations of specials
    const queue = [...clear];
    while (queue.length) {
      const k = queue.pop(), r = (k / N) | 0, c = k % N, g = grid[r][c];
      if (!g || g.special === NONE) continue;
      let hit = [];
      if (g.special === LINE_H) { hit = [...Array(N)].map((_, i) => key(r, i)); lineFx(r, c, 'h', g.color); }
      if (g.special === LINE_V) { hit = [...Array(N)].map((_, i) => key(i, c)); lineFx(r, c, 'v', g.color); }
      if (g.special === PRISM && !g._fired) {
        g._fired = true; const col = rnd(nColors);
        for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) if (grid[rr][cc].color === col) { hit.push(key(rr, cc)); beam({ r, c }, { r: rr, c: cc }, col); }
      }
      g.special = g.special === PRISM ? PRISM : NONE; // prevent re-fire
      for (const h of hit) if (!clear.has(h)) { clear.add(h); queue.push(h); }
    }
    // don't remove cells that become specials
    for (const cr of creates) clear.delete(key(cr.r, cr.c));
    // score + effects
    const pts = clear.size * 10 * combo + creates.length * 50;
    score += pts;
    let sx = 0, sy = 0;
    for (const k of clear) {
      const r = (k / N) | 0, c = k % N, g = grid[r][c];
      sx += c; sy += r; burst(c, r, g.special === PRISM ? -1 : g.color, 10 + combo * 3);
      g.dying = 1e-6;
    }
    popups.push({ x: (sx / clear.size + .5), y: (sy / clear.size + .5), text: '+' + pts + (combo > 1 ? '  x' + combo : ''), t: 0 });
    if (combo > 1) { shake = Math.min(18, 3 + combo * 3); buzz(10 + combo * 6); } else buzz(6);
    for (const cr of creates) { const g = grid[cr.r][cr.c]; g.special = cr.sp; g.spawn = 1; rings.push({ x: cr.c + .5, y: cr.r + .5, t: 0, color: cr.color }); }
    updateHud();
    await tween(CLEAR_T, t => { for (const k of clear) { const g = grid[(k / N) | 0][k % N]; g.scale = 1 + t * .35; g.alpha = 1 - t; } });
    for (const k of clear) grid[(k / N) | 0][k % N] = null;
    await gravity();
    first = false;
  }
  if (!findMove()) await reshuffle();
}

function gravity() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) if (grid[r][c]) { const g = grid[r][c]; grid[r][c] = null; grid[w][c] = g; w--; }
    let spawnY = -1;
    for (let r = w; r >= 0; r--) { const g = gem(rnd(nColors)); g.x = c; g.y = spawnY--; g.vy = 0; grid[r][c] = g; }
  }
  // physics fall with bounce
  return tween(10, (t, dt) => {
    let moving = false;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const g = grid[r][c]; if (!g || g.y >= r && Math.abs(g.vy) < .5) { if (g) { g.y = r; g.vy = 0; } continue; }
      g.vy += FALL_G * dt; g.y += g.vy * dt;
      if (g.y >= r) { g.y = r; g.vy = g.vy > 4 ? -g.vy * .18 : 0; }
      moving = true;
    }
    return moving ? undefined : 'done';
  });
}

async function reshuffle() {
  popups.push({ x: N / 2, y: N / 2, text: 'SHUFFLE', t: 0, big: true });
  const all = grid.flat();
  do {
    for (let i = all.length - 1; i > 0; i--) { const j = rnd(i + 1); [all[i], all[j]] = [all[j], all[i]]; }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c] = all[r * N + c];
  } while (findRuns().length || !findMove());
  const from = all.map(g => [g.x, g.y]);
  await tween(.4, t => { const k = ease(t); for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const g = grid[r][c], i = all.indexOf(g); g.x = from[i][0] + (c - from[i][0]) * k; g.y = from[i][1] + (r - from[i][1]) * k; } });
}

// ---------- effects ----------
function burst(c, r, color, n) {
  const [cr, cg, cb] = color < 0 ? [255, 255, 255] : COLORS[color];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 7;
    parts.push({ x: c + .5, y: r + .5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, decay: 1.2 + Math.random() * 1.2, sz: .04 + Math.random() * .08, col: `${cr},${cg},${cb}`, spark: Math.random() < .35 });
  }
  if (parts.length > 900) parts.splice(0, parts.length - 900);
}
function lineFx(r, c, dir, color) { rings.push({ line: dir, x: c + .5, y: r + .5, t: 0, color }); shake = Math.max(shake, 8); }
function beam(a, b, color) { rings.push({ beam: true, x: a.c + .5, y: a.r + .5, x2: b.c + .5, y2: b.r + .5, t: 0, color }); }
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

// ---------- input: swipe or tap-tap ----------
let down = null;
function cellAt(e) { const b = cvs.getBoundingClientRect(); return { c: Math.floor((e.clientX - b.left) / cell), r: Math.floor((e.clientY - b.top) / cell), x: e.clientX, y: e.clientY }; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); if (busy) return;
  const p = cellAt(e); if (!at(p.r, p.c)) return;
  cvs.setPointerCapture(e.pointerId); idle = 0; hint = null;
  if (sel && Math.abs(sel.r - p.r) + Math.abs(sel.c - p.c) === 1) { const s = sel; sel = null; trySwap(s, p); return; }
  down = p; sel = { r: p.r, c: p.c }; buzz(3);
});
cvs.addEventListener('pointermove', e => {
  if (!down || busy) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, th = cell * .3;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  const b = Math.abs(dx) > Math.abs(dy) ? { r: down.r, c: down.c + Math.sign(dx) } : { r: down.r + Math.sign(dy), c: down.c };
  const a = { r: down.r, c: down.c }; down = null; trySwap(a, b);
});
const up = () => { down = null; };
cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);

// ---------- rendering ----------
let bgT = 0;
function draw(dt) {
  const W = size;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, W);
  ctx.save();
  if (shake > .1) { ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); }
  // board backdrop
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) & 1 ? 'rgba(255,255,255,.035)' : 'rgba(255,255,255,.065)';
    ctx.fillRect(c * cell + 1, r * cell + 1, cell - 2, cell - 2);
  }
  // aurora sweep
  bgT += dt;
  const ag = ctx.createLinearGradient(0, 0, W, W);
  const hue = (bgT * 20) % 360;
  ag.addColorStop(0, `hsla(${hue},90%,60%,.06)`); ag.addColorStop(1, `hsla(${hue + 120},90%,60%,.06)`);
  ctx.fillStyle = ag; ctx.fillRect(0, 0, W, W);

  // selection
  if (sel) { const pulse = .5 + .5 * Math.sin(time * 10);
    ctx.strokeStyle = `rgba(255,255,255,${.5 + pulse * .5})`; ctx.lineWidth = 3;
    roundRect(sel.c * cell + 3, sel.r * cell + 3, cell - 6, cell - 6, cell * .2); ctx.stroke(); }

  // gems (additive-feel glow comes from sprite)
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, W); ctx.clip();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c]; if (!g) continue;
    const spr = sprite(g.color, g.special);
    let s = g.scale;
    if (g.spawn > 0) { g.spawn = Math.max(0, g.spawn - dt * 2.5); s *= 1 + Math.sin(g.spawn * Math.PI) * .4; }
    if (hint && ((hint.a.r === r && hint.a.c === c) || (hint.b.r === r && hint.b.c === c))) s *= 1 + .08 * Math.sin(time * 8);
    if (g.special === PRISM) s *= 1 + .05 * Math.sin(time * 5);
    const sz = cell * 1.6 * s, cx = (g.x + .5) * cell, cy = (g.y + .5) * cell;
    ctx.globalAlpha = g.alpha;
    ctx.drawImage(spr, cx - sz / 2, cy - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1; ctx.restore();

  // additive layer: particles, rings, beams
  ctx.globalCompositeOperation = 'lighter';
  for (let i = rings.length - 1; i >= 0; i--) {
    const k = rings[i]; k.t += dt;
    const [cr, cg, cb] = COLORS[k.color] || [255, 255, 255];
    if (k.beam) {
      const a = 1 - k.t / .45; if (a <= 0) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},${a})`; ctx.lineWidth = cell * .12 * a + 1;
      ctx.beginPath(); ctx.moveTo(k.x * cell, k.y * cell); ctx.lineTo(k.x2 * cell, k.y2 * cell); ctx.stroke();
    } else if (k.line) {
      const a = 1 - k.t / .35; if (a <= 0) { rings.splice(i, 1); continue; }
      const th = cell * (.2 + .8 * a);
      const grd = k.line === 'h' ? ctx.createLinearGradient(0, k.y * cell - th, 0, k.y * cell + th) : ctx.createLinearGradient(k.x * cell - th, 0, k.x * cell + th, 0);
      grd.addColorStop(0, `rgba(${cr},${cg},${cb},0)`); grd.addColorStop(.5, `rgba(255,255,255,${a})`); grd.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = grd;
      if (k.line === 'h') ctx.fillRect(0, k.y * cell - th, W, th * 2); else ctx.fillRect(k.x * cell - th, 0, th * 2, W);
    } else {
      const a = 1 - k.t / .5; if (a <= 0) { rings.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},${a})`; ctx.lineWidth = 4 * a;
      ctx.beginPath(); ctx.arc(k.x * cell, k.y * cell, cell * (.3 + k.t * 3), 0, Math.PI * 2); ctx.stroke();
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= p.decay * dt; if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.vy += 14 * dt; p.vx *= .98; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.fillStyle = `rgba(${p.col},${p.life})`;
    if (p.spark) { ctx.save(); ctx.translate(p.x * cell, p.y * cell); ctx.rotate(Math.atan2(p.vy, p.vx)); ctx.fillRect(-cell * .15, -1, cell * .3, 2); ctx.restore(); }
    else { const s = p.sz * cell * (0.5 + p.life); ctx.beginPath(); ctx.arc(p.x * cell, p.y * cell, s, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalCompositeOperation = 'source-over';

  // score popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i]; p.t += dt; const a = 1 - p.t / 1; if (a <= 0) { popups.splice(i, 1); continue; }
    ctx.font = `800 ${(p.big ? cell * .7 : cell * .38) * (1 + .3 * Math.max(0, .15 - p.t) / .15)}px system-ui,sans-serif`;
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 6;
    ctx.fillText(p.text, p.x * cell, (p.y - p.t * .8) * cell); ctx.shadowBlur = 0;
  }
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .5})`; ctx.fillRect(0, 0, W, W); }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const done = tw.fn(Math.min(1, tw.t / tw.dur), dt) === 'done' || tw.t >= tw.dur;
    if (done) { if (tw.dur < 5) tw.fn(1, 0); tweens.splice(i, 1); tw.res(); }
  }
  shake *= Math.pow(.001, dt); flash = Math.max(0, flash - dt * 3);
  if (!busy && playing) { idle += dt; if (idle > 5 && !hint) hint = findMove(); }
  draw(dt);
  requestAnimationFrame(frame);
}

// ---------- game flow ----------
let playing = false;
function updateHud() {
  $('level').textContent = level; $('score').textContent = score.toLocaleString(); $('moves').textContent = moves;
  $('fill').style.width = Math.min(100, score / goal * 100) + '%';
}
async function startLevel() {
  nColors = level >= 3 ? 6 : 5;
  goal = score + 1500 + level * 700; moves = 20 + Math.max(0, 5 - level);
  sprites.clear(); newBoard(); updateHud(); busy = true; playing = true;
  await gravity(); busy = false;
}
function checkEnd() {
  if (score >= goal) { playing = false; show('Level ' + level + ' clear!', `Score ${score.toLocaleString()}. Bonus for ${moves} spare moves.`, 'Next', () => { score += moves * 100; level++; startLevel(); }); }
  else if (moves <= 0) { playing = false; show('Out of moves', `Final score ${score.toLocaleString()} on level ${level}.`, 'Retry', () => { score = 0; level = 1; startLevel(); }); }
}
function show(title, msg, btn, cb) {
  const h = $('overlay').querySelector('h1'); h.textContent = title; h.style.fontSize = '34px'; h.style.letterSpacing = '2px'; $('msg').textContent = msg; $('go').textContent = btn;
  $('overlay').classList.remove('hide');
  $('go').onclick = () => { $('overlay').classList.add('hide'); cb(); };
}
$('go').onclick = () => { $('overlay').classList.add('hide'); startLevel(); };

resize(); newBoard(); requestAnimationFrame(frame);
</script>
</body>
